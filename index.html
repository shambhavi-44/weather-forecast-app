<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="weather-app">
    <header class="app-header">
      <p class="eyebrow">YOUR DAILY WEATHER</p>
      <h1>Weather Forecast</h1>
      <p class="subtitle">Find the weather anywhere in the world.</p>
    </header>

    <form id="search-form" class="search-form">
      <label class="sr-only" for="city-input">City name</label>
      <input
        id="city-input"
        type="search"
        placeholder="Enter a city, e.g. Mumbai"
        autocomplete="off"
        required
      >
      <button type="submit">Search</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">
      Search for a city to see its forecast.
    </p>

    <section id="weather-panel" class="weather-panel" hidden>
      <div class="current-weather">
        <div>
          <p id="location-name" class="location-name"></p>
          <p id="current-description" class="current-description"></p>
          <p id="current-details" class="current-details"></p>
        </div>

        <div class="temperature-block">
          <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
          <p class="temperature">
            <span id="current-temp"></span><span>°C</span>
          </p>
        </div>
      </div>

      <div class="forecast-heading">
        <h2>5-day forecast</h2>
        <p>Daily temperatures</p>
      </div>

      <div id="forecast-list" class="forecast-list"></div>
    </section>

    <footer class="app-footer">
      Weather data by
      <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">
        Open-Meteo
      </a>
    </footer>
  </main>
</body>
</html>
